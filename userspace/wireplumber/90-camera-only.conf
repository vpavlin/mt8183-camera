# Use PipeWire for the cameras only and leave audio to PulseAudio:
# install as ~/.config/wireplumber/wireplumber.conf.d/90-camera-only.conf
# (WirePlumber 0.5). Drop the alsa/bluez lines if PipeWire handles audio too.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    # the CAMSV video nodes are raw/MC-only: expose cameras via libcamera only
    monitor.v4l2 = disabled
    monitor.libcamera = required
  }
}
